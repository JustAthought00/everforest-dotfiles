# Minimal Everforest lock screen
# Login authentication uses the system's existing PAM configuration.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(2d353bff)
}

# Clock and date, centred on each display.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(d3c6aaff)
    font_size = 72
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(859289ff)
    font_size = 15
    font_family = $font
    position = 0, 65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 12
    outer_color = rgba(475258ff)
    inner_color = rgba(343f44ff)
    font_color = rgba(d3c6aaff)
    font_family = $font
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    placeholder_text = Password
    check_text = Checking...
    check_color = rgba(a7c080ff)
    fail_color = rgba(e67e80ff)
    fail_text = $PAMFAIL
    capslock_color = rgba(dbbc7fff)
    position = 0, -35
    halign = center
    valign = center
}

label {
    monitor =
    text = Type password · Enter to unlock
    color = rgba(859289ff)
    font_size = 11
    font_family = $font
    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-battery.sh
    color = rgba(859289ff)
    font_size = 12
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}

# BEGIN MEDIA WIDGET
# Prefer a playing player, otherwise use a paused player. Titles are escaped.
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-media.py track
    color = rgba(d3c6aaff)
    font_size = 12
    font_family = $font
    position = 0, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-media.py control
    onclick = ~/.config/hypr/scripts/lock-media.py toggle
    color = rgba(a7c080ff)
    font_size = 17
    font_family = $font
    position = 0, -205
    halign = center
    valign = center
}
# END MEDIA WIDGET
